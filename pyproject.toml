[project]
name = "django-pgschemas"
version = "0.16.1"
description = "Multi-tenancy on Django using PostgreSQL schemas."
readme = "README.rst"
license = { text = "MIT" }
authors = [{ name = "Lorenzo Peña", email = "lorinkoz@gmail.com" }]
keywords = ["django", "tenants", "schemas", "multi-tenancy", "postgresql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
]
requires-python = ">=3.10"
dependencies = ["django>=5.0,<6"]

[dependency-groups]
dev = [
    "black==24.8.0", # matches the formatting already in this branch
    "channels",
    "coverage[toml]",
    "doc8",
    "mypy",
    "ruff",
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-django-command",
]
psycopg = ["psycopg"]

[project.urls]
repository = "https://github.com/lorinkoz/django-pgschemas"
documentation = "https://django-pgschemas.readthedocs.io/"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "E", "F"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["django_pgschemas"]

[tool.black]
line-length = 100

[tool.mypy]
strict_optional = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["channels.*", "psycopg.*", "psycopg2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "docs.*",
    "django_pgschemas.contrib.*",
    "django_pgschemas.postgresql_backend.*",
    "dpgs_sandbox.*",
]
ignore_errors = true

[tool.coverage.run]
source = ["django_pgschemas"]
omit = ["django_pgschemas/contrib/channels*"]

[tool.hatch.build.targets.wheel]
packages = ["django_pgschemas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

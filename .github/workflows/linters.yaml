name: linters

on:
  pull_request:
  push:
    branches:
      - v0
    paths:
      - pyproject.toml
      - uv.lock
      - "**.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10" # lowest python supported
      - name: Install Dependencies
        run: uv sync --group dev
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
